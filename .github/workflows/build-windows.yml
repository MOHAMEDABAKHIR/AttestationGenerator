name: Build Windows Application

on:
  workflow_dispatch:

jobs:
  build-windows:

    runs-on: windows-latest

    steps:

      # ==========================================
      # 1. Récupérer le projet
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Installer Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # 3. Installer les dépendances
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller


      # ==========================================
      # 4. Vérifier Python et PyInstaller
      # ==========================================

      - name: Verify environment
        run: |
          python --version
          pyinstaller --version


            # ==========================================
      # 5. Construire l'application
      # ==========================================

      - name: Build Windows application
        run: |
          pyinstaller --clean --noconfirm build.spec


      # ==========================================
      # 6. Vérifier le résultat
      # ==========================================

      - name: Verify build
        shell: powershell
        run: |
          Write-Host "=== DIST ==="
          Get-ChildItem -Recurse dist

          if (!(Test-Path "dist\AttestationGenerator\AttestationGenerator.exe")) {
              Write-Error "AttestationGenerator.exe not found!"
              exit 1
          }

          if (!(Test-Path "dist\AttestationGenerator\templates")) {
              Write-Error "templates directory not found!"
              exit 1
          }

          Write-Host "Build verification successful."


      # ==========================================
      # 7. Créer le ZIP
      # ==========================================

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\AttestationGenerator\*" `
            -DestinationPath "AttestationGenerator-Windows.zip" `
            -Force


      # ==========================================
      # 8. Publier le résultat
      # ==========================================

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AttestationGenerator-Windows
          path: AttestationGenerator-Windows.zip